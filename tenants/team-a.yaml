apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: team-a-cluster
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.loft.sh
    chart: vcluster
    # TARGETING THE LATEST STABLE VERSION
    targetRevision: 0.30.2
    helm:
      releaseName: team-a
      values: |
        # In v0.20+, 'service' moved inside 'controlPlane'
        controlPlane:
          service:
            spec:
              type: NodePort
  destination:
    server: https://kubernetes.default.svc
    namespace: team-a
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
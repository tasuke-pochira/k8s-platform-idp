apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: team-a-cluster
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.loft.sh
    chart: vcluster
    targetRevision: 0.30.2
    helm:
      releaseName: team-a
      values: |
        controlPlane:
          service:
            spec:
              type: NodePort
        
        # NEW: Sleep Mode Configuration
        sleepMode:
          enabled: true
          # Sleep after 2 minutes of inactivity
          autoSleep:
            afterActivity: 2m
  destination:
    server: https://kubernetes.default.svc
    namespace: team-a
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true